services:
  mongo:
    image: mongo:4.4
    container_name: tesserae-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./apitess
    container_name: tesserae-backend
    ports:
      - "5000:5000"
      - "8000:8000"
    environment:
      - MONGO_HOSTNAME=mongo
      - MONGO_PORT=27017
      - MONGO_USER=
      - MONGO_PASSWORD=
      - DB_NAME=tesserae
    depends_on:
      - mongo

  # frontend:
